name: Playwright Automation

on:

  push:

    branches:
      - main


  pull_request:

    branches:
      - main


  workflow_dispatch:




permissions:

  contents: write

  pages: write




jobs:

  test:

    runs-on: ubuntu-latest




    steps:


      - name: Checkout code

        uses: actions/checkout@v4




      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 21




      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 20




      - name: Cache Maven

        uses: actions/cache@v4

        with:

          path: ~/.m2

          key: maven-${{ runner.os }}




      - name: Install Playwright

        run: |

          npm install -g playwright

          npx playwright install --with-deps




      - name: Run Tests

        run: mvn clean test




      - name: Generate Playwright HTML Report

        if: always()

        run: |

          mvn surefire-report:report




      - name: Install Allure

        if: always()

        run: |

          npm install -g allure-commandline --save-dev




      - name: Generate Allure Report

        if: always()

        run: |

          allure generate allure-results --clean -o allure-report




      - name: Upload Allure Results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: allure-results

          path: allure-results




      - name: Upload Screenshots

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: screenshots

          path: screenshots




      - name: Upload Videos

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: videos

          path: videos




      - name: Upload Traces

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: traces

          path: traces




      - name: Upload Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: reports

          path: reports




      - name: Build Dashboard

        if: always()

        run: |

          mkdir -p dashboard/allure

          mkdir -p dashboard/playwright

          cp -r allure-report/* dashboard/allure/ || true

          cp -r target/site/* dashboard/playwright/ || true

          echo "
          <html>

          <head>

              <title>PMI Automation Dashboard</title>

              <style>

                  body{

                      font-family:Arial;

                      padding:40px;

                      background:#f5f5f5;
                  }

                  h1{

                      color:#333;
                  }

                  a{

                      display:block;

                      margin:20px 0;

                      padding:15px;

                      width:300px;

                      background:#0d6efd;

                      color:white;

                      text-decoration:none;

                      border-radius:8px;
                  }

                  a:hover{

                      background:#084298;
                  }

              </style>

          </head>

          <body>

              <h1>PMI Automation Dashboard</h1>

              <a href='allure/index.html'>

                  Open Allure Report

              </a>

              <a href='playwright/index.html'>

                  Open Playwright Report

              </a>

          </body>

          </html>
          " > dashboard/index.html




      - name: Deploy Pages

        if: always()

        uses: peaceiris/actions-gh-pages@v4

        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_dir: ./dashboard